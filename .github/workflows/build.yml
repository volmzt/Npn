name: Build release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip if exists
        run: |
          shopt -s nullglob
          for z in project_source.zip *.zip; do
            [ -f "$z" ] || continue
            echo "Extracting $z"
            unzip -q -o "$z" -d extracted_project/
          done

      - name: Locate Gradle project root
        id: root
        run: |
          ROOT=""
          for SEARCH in extracted_project .; do
            [ -d "$SEARCH" ] || continue
            ROOT=$(find "$SEARCH" -maxdepth 6 -path ./.git -prune -o \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | sort | head -n1)
            [ -n "$ROOT" ] && break
          done
          if [ -z "$ROOT" ]; then
            echo "::error::settings.gradle(.kts) not found. Repository contents:"
            find . -path ./.git -prune -o -maxdepth 4 -print | head -n 100
            exit 1
          fi
          echo "Project root: $ROOT"
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: HyperLauncherSim-release-apk
          path: ${{ steps.root.outputs.dir }}/app/build/outputs/apk/release/*.apk
